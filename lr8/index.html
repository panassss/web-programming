<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="todo-container">
        <h1>ToDo List</h1>
        
        <div class="todo-box">
            <input 
                type="text" 
                id="todo-input" 
                placeholder="Додайте завдання" 
                autocomplete="off"
            >

            <ul id="todo-list"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
